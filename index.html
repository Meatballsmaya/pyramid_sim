    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Prevent Vite client from auto-reloading the page when HMR WebSocket disconnects in iframe/Cloud Run environment
      (function() {
        if (typeof window !== 'undefined') {
          const OrigWebSocket = window.WebSocket;
          class MockHmrSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = url;
              this.protocols = protocols;
              this.readyState = 1; // WebSocket.OPEN
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              setTimeout(() => {
                const openEvt = new Event('open');
                this.dispatchEvent(openEvt);
                if (typeof this.onopen === 'function') this.onopen(openEvt);
              }, 10);
            }
            send() {}
            close() {}
          }
          MockHmrSocket.CONNECTING = 0;
          MockHmrSocket.OPEN = 1;
          MockHmrSocket.CLOSING = 2;
          MockHmrSocket.CLOSED = 3;

          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || '');
            const isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              urlStr.includes('vite-hmr') ||
              urlStr.includes('token=');

            if (isViteHmr) {
              return new MockHmrSocket(url, protocols);
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          if (OrigWebSocket) {
            window.WebSocket.prototype = OrigWebSocket.prototype;
          }
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
